# =========================================================
# Prometheus Configuration File
# Scrapes Flask Application, cAdvisor, Node Exporter, and Prometheus
# =========================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

# Alertmanager configuration (placeholder for enterprise extension)
alerting:
  alertmanagers: []

# Rule files for alerting
rule_files: []

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Flask Web Application metrics
  - job_name: "flask-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:5000"]
        labels:
          service: "flask-backend"
          environment: "production"

  # 3. Host System Metrics (Node Exporter)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          role: "ec2-host"

  # 4. Container Resource & Lifecycle Metrics (cAdvisor)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          role: "docker-daemon"
